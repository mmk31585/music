app = "music-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health"
    timeout = "5s"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory = "512MB"

[env]
  APP_ENV = "production"
  GIN_MODE = "release"

# Required secrets (set via `fly secrets set`):
# DATABASE_URL
# music_REDIS_URL
# JWT_SECRET
# SENTRY_DSN
# CORS_ALLOWED_ORIGINS
# STORAGE_LOCAL_BASE_DIR