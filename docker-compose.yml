services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-muse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-muse}
      POSTGRES_DB: ${POSTGRES_DB:-muse}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-muse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_SOURCE: postgres://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-muse}@postgres:5432/${POSTGRES_DB:-muse}?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: .env
    environment:
      DATABASE_SOURCE: postgres://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-muse}@postgres:5432/${POSTGRES_DB:-muse}?sslmode=disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend

  ml:
    build:
      context: ./moja-ml-service
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - "8000:8000"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrate
    env_file: .env
    environment:
      DATABASE_SOURCE: postgres://${POSTGRES_USER:-muse}:${POSTGRES_PASSWORD:-muse}@postgres:5432/${POSTGRES_DB:-muse}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./migrate"]

volumes:
  pgdata:
  redisdata:
  miniodata:
