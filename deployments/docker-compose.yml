services:
  postgres:
    image: postgres:16
    container_name: musicapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - musicapp_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: musicapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  musicapp_postgres_data:
