services:
  postgres:
    image: postgres:17
    container_name: musicapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - musicapp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: musicapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.19.5
    container_name: musicapp_opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: musicapp_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    volumes:
      - musicapp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: musicapp_minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio123; do sleep 2; done;
      mc mb -p local/music-media || true;
      mc anonymous set download local/music-media || true;
      exit 0;
      "

  api:
    image: deployments-api:latest
    container_name: musicapp_api
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      APP_PORT: "8085"
      APP_ENV: production
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/musicapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "tracks"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:8080"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:-change_me_access_secret}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change_me_refresh_secret}"
      JWT_ACCESS_TTL_MINUTES: "15"
      JWT_REFRESH_TTL_DAYS: "30"
      STORAGE_DRIVER: "s3"
      S3_BUCKET: "music-media"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minio"
      S3_SECRET_ACCESS_KEY: "minio123"
      S3_PUBLIC_BASE_URL: "http://localhost:9000/music-media"
      S3_USE_PATH_STYLE: "true"
      S3_PRESIGN_URLS: "false"
      MEDIA_MAX_FILE_SIZE_MB: "30"
      MEDIA_MAX_IMAGE_SIZE_MB: "5"
      MEDIA_MAX_AUDIO_SIZE_MB: "30"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: deployments-worker:latest
    container_name: musicapp_worker
    restart: unless-stopped
    environment:
      APP_ENV: production
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/musicapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      OPENSEARCH_URL: "http://opensearch:9200"
      OPENSEARCH_INDEX: "tracks"
      STORAGE_DRIVER: "s3"
      S3_BUCKET: "music-media"
      S3_REGION: "us-east-1"
      S3_ENDPOINT: "http://minio:9000"
      S3_ACCESS_KEY_ID: "minio"
      S3_SECRET_ACCESS_KEY: "minio123"
      S3_PUBLIC_BASE_URL: "http://localhost:9000/music-media"
      S3_USE_PATH_STYLE: "true"
      S3_PRESIGN_URLS: "false"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_started

  frontend:
    image: deployments-frontend:latest
    container_name: musicapp_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started

volumes:
  musicapp_postgres_data:
  musicapp_minio_data:
