services:
  postgres:
    image: postgres:17
    container_name: musicapp_postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: musicapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - musicapp_postgres_data:/var/lib/postgresql/data
    command: ["-c", "unix_socket_directories="]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d musicapp -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicapp_network

  redis:
    image: redis:7.4-alpine
    container_name: musicapp_redis
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicapp_network

  opensearch:
    image: opensearchproject/opensearch:3.2.0
    container_name: musicapp_opensearch
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      plugins.security.ssl.http.enabled: "false"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicapp_network

  minio:
    image: minio/minio
    container_name: musicapp_minio
    restart: unless-stopped
    mem_limit: 512m
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - musicapp_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - musicapp_network

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: musicapp-api:latest
    container_name: musicapp_api
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "8080:8080"
    volumes:
      - musicapp_uploads:/app/uploads
    environment:
      APP_PORT: "8080"
      APP_ENV: development
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/musicapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      CORS_ALLOWED_ORIGINS: "http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:8080"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}"
      JWT_ACCESS_TTL_MINUTES: "60"
      JWT_REFRESH_TTL_DAYS: "30"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_BASE_DIR: "/app/uploads"
      STORAGE_LOCAL_BASE_URL: "http://localhost:8080/uploads"
      MEDIA_MAX_FILE_SIZE_MB: "30"
      MEDIA_MAX_IMAGE_SIZE_MB: "5"
      MEDIA_MAX_AUDIO_SIZE_MB: "30"
      LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - musicapp_network

  worker:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        CMD_DIR: worker
    image: musicapp-worker:latest
    container_name: musicapp_worker
    restart: unless-stopped
    mem_limit: 512m
    environment:
      APP_ENV: development
      POSTGRES_URL: "postgres://postgres:postgres@postgres:5432/musicapp?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      IMPORT_PROXY: "${IMPORT_PROXY:-}"
      STORAGE_DRIVER: "local"
      STORAGE_LOCAL_BASE_DIR: "/app/uploads"
      STORAGE_LOCAL_BASE_URL: "http://localhost:8080/uploads"
      MEDIA_MAX_FILE_SIZE_MB: "30"
      MEDIA_MAX_IMAGE_SIZE_MB: "5"
      MEDIA_MAX_AUDIO_SIZE_MB: "30"
      LOG_LEVEL: debug
    volumes:
      - musicapp_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - musicapp_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    image: musicapp-frontend:latest
    container_name: musicapp_frontend
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - musicapp_network
networks:
  musicapp_network:
    name: musicapp_network
volumes:
  musicapp_minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/space/.docker-volumes/music_minio_data
  musicapp_uploads:
  musicapp_postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/space/.docker-volumes/music_postgres_data
