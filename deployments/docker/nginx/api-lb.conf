# API Load Balancer — round-robin across Go API replicas
# Scale with: docker compose up --scale api=3 -d
# The DNS resolver resolves "api" to all container IPs automatically.

resolver 127.0.0.11 valid=10s;

upstream api_backend {
    # Docker Compose DNS round-robin: "api" resolves to all replicas
    server api:8080 max_fails=3 fail_timeout=30s;
}

server {
    listen 8081;
    server_name _;

    client_max_body_size 30M;

    location / {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/v1/ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
