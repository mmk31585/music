basePath: /api/v1
definitions:
  album.Album:
    properties:
      albumType:
        type: string
      artistId:
        type: string
      coverUrl:
        type: string
      createdAt:
        type: string
      id:
        type: string
      releaseDate:
        type: string
      slug:
        type: string
      title:
        type: string
      updatedAt:
        type: string
    type: object
  album.CreateRequest:
    properties:
      album_type:
        enum:
        - album
        - single
        - ep
        - compilation
        type: string
      artist_id:
        type: string
      cover_url:
        type: string
      release_date:
        type: string
      title:
        maxLength: 250
        minLength: 1
        type: string
    required:
    - artist_id
    - title
    type: object
  album.UpdateRequest:
    properties:
      album_type:
        enum:
        - album
        - single
        - ep
        - compilation
        type: string
      cover_url:
        type: string
      release_date:
        type: string
      title:
        maxLength: 250
        minLength: 1
        type: string
    type: object
  analytics.TrackEventRequest:
    properties:
      album_id:
        type: string
      artist_id:
        type: string
      event_type:
        type: string
      metadata:
        additionalProperties: {}
        type: object
      playlist_id:
        type: string
      query:
        type: string
      track_id:
        type: string
    required:
    - event_type
    type: object
  analytics.TrackEventResponse:
    properties:
      message:
        type: string
    type: object
  artist.Artist:
    properties:
      bio:
        type: string
      createdAt:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      isVerified:
        type: boolean
      monthlyListeners:
        type: integer
      name:
        type: string
      slug:
        type: string
      updatedAt:
        type: string
    type: object
  artist.CreateRequest:
    properties:
      bio:
        maxLength: 5000
        type: string
      image_url:
        type: string
      is_verified:
        type: boolean
      monthly_listeners:
        minimum: 0
        type: integer
      name:
        maxLength: 200
        minLength: 1
        type: string
    required:
    - name
    type: object
  artist.UpdateRequest:
    properties:
      bio:
        maxLength: 5000
        type: string
      image_url:
        type: string
      is_verified:
        type: boolean
      monthly_listeners:
        minimum: 0
        type: integer
      name:
        maxLength: 200
        minLength: 1
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        type: string
    required:
    - refreshToken
    type: object
  auth.RegisterRequest:
    properties:
      displayName:
        maxLength: 100
        minLength: 2
        type: string
      email:
        maxLength: 255
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - displayName
    - email
    - password
    - username
    type: object
  follow.FollowResponse:
    properties:
      message:
        type: string
    type: object
  genre.CreateRequest:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    required:
    - name
    type: object
  genre.Genre:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  genre.UpdateRequest:
    properties:
      name:
        maxLength: 100
        minLength: 2
        type: string
    type: object
  history.HistoryResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/history.ListeningHistoryItem'
        type: array
      pagination:
        $ref: '#/definitions/history.PaginationResponse'
    type: object
  history.ListeningHistoryItem:
    properties:
      completed:
        type: boolean
      duration:
        type: integer
      id:
        type: string
      played_at:
        type: string
      track_id:
        type: string
      user_id:
        type: string
    type: object
  history.PaginationResponse:
    properties:
      count:
        type: integer
      has_more:
        type: boolean
      limit:
        type: integer
      offset:
        type: integer
    type: object
  library.AddPlayHistoryRequest:
    properties:
      track_id:
        type: integer
    required:
    - track_id
    type: object
  library.FollowArtistRequest:
    properties:
      artist_id:
        type: integer
    required:
    - artist_id
    type: object
  library.LikeAlbumRequest:
    properties:
      album_id:
        type: integer
    required:
    - album_id
    type: object
  library.LikeTrackRequest:
    properties:
      track_id:
        type: integer
    required:
    - track_id
    type: object
  lyrics.CreateLyricsRequest:
    properties:
      content:
        type: string
      language:
        maxLength: 10
        minLength: 2
        type: string
      track_id:
        type: string
      type:
        enum:
        - plain
        - lrc
        type: string
    required:
    - content
    - language
    - track_id
    - type
    type: object
  lyrics.UpdateLyricsRequest:
    properties:
      content:
        type: string
      language:
        type: string
      type:
        type: string
    type: object
  notification.ListNotificationsResponse:
    properties:
      notifications:
        items:
          $ref: '#/definitions/notification.NotificationResponse'
        type: array
      unreadCount:
        type: integer
    type: object
  notification.MarkReadResponse:
    properties:
      message:
        type: string
    type: object
  notification.NotificationResponse:
    properties:
      body:
        type: string
      createdAt:
        type: string
      entityId:
        type: string
      entityType:
        type: string
      id:
        type: string
      isRead:
        type: boolean
      payload:
        additionalProperties: {}
        type: object
      readAt:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  playlist.AddTrackRequest:
    properties:
      track_id:
        type: integer
    required:
    - track_id
    type: object
  playlist.CreatePlaylistRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  playlist.ReorderTrackRequest:
    properties:
      new_position:
        type: integer
      track_id:
        type: integer
    required:
    - new_position
    - track_id
    type: object
  playlist.UpdatePlaylistRequest:
    properties:
      cover_url:
        type: string
      description:
        type: string
      is_public:
        type: boolean
      name:
        maxLength: 255
        minLength: 1
        type: string
    required:
    - name
    type: object
  queue.AddTrackRequest:
    properties:
      mode:
        description: |-
          mode:
          "next"  = play next, insert at position 1
          "later" = play later, insert at end

          Default: "later"
        type: string
      track_id:
        type: string
    required:
    - track_id
    type: object
  queue.AddTrackResponse:
    properties:
      item:
        $ref: '#/definitions/queue.QueueItem'
    type: object
  queue.MessageResponse:
    properties:
      message:
        type: string
    type: object
  queue.QueueItem:
    properties:
      created_at:
        type: string
      id:
        type: string
      position:
        type: integer
      track_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  queue.QueueResponse:
    properties:
      count:
        type: integer
      items:
        items:
          $ref: '#/definitions/queue.QueueItem'
        type: array
    type: object
  queue.ReorderQueueItemRequest:
    properties:
      id:
        type: string
      position:
        minimum: 1
        type: integer
    required:
    - id
    - position
    type: object
  queue.ReorderQueueRequest:
    properties:
      items:
        items:
          $ref: '#/definitions/queue.ReorderQueueItemRequest'
        minItems: 1
        type: array
    required:
    - items
    type: object
  response.ErrorResponse:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  response.SuccessResponse:
    properties:
      data: {}
      message:
        example: request completed successfully
        type: string
      meta: {}
      success:
        example: true
        type: boolean
    type: object
  subscription.CancelSubscriptionResponse:
    properties:
      message:
        type: string
      subscription:
        $ref: '#/definitions/subscription.SubscriptionResponse'
    type: object
  subscription.CheckoutRequest:
    properties:
      planId:
        type: string
    required:
    - planId
    type: object
  subscription.CheckoutResponse:
    properties:
      available:
        type: boolean
      message:
        type: string
      payment:
        $ref: '#/definitions/subscription.PaymentResponse'
      subscription:
        $ref: '#/definitions/subscription.SubscriptionResponse'
    type: object
  subscription.ErrorResponse:
    properties:
      error:
        type: string
    type: object
  subscription.PaymentResponse:
    properties:
      amountCents:
        type: integer
      createdAt:
        type: string
      currency:
        type: string
      failureReason:
        type: string
      id:
        type: string
      paidAt:
        type: string
      planId:
        type: string
      provider:
        type: string
      status:
        type: string
      subscriptionId:
        type: string
      userId:
        type: string
    type: object
  subscription.PlanResponse:
    properties:
      available:
        type: boolean
      code:
        type: string
      currency:
        type: string
      description:
        type: string
      features:
        items:
          type: string
        type: array
      id:
        type: string
      interval:
        type: string
      isActive:
        type: boolean
      isPremium:
        type: boolean
      name:
        type: string
      priceCents:
        type: integer
    type: object
  subscription.SubscriptionResponse:
    properties:
      cancelAtPeriodEnd:
        type: boolean
      canceledAt:
        type: string
      createdAt:
        type: string
      currentPeriodEnd:
        type: string
      currentPeriodStart:
        type: string
      id:
        type: string
      plan:
        $ref: '#/definitions/subscription.PlanResponse'
      planId:
        type: string
      status:
        type: string
      userId:
        type: string
    type: object
  track.CreateRequest:
    properties:
      album_id:
        type: string
      artist_id:
        type: string
      audio_url:
        type: string
      cover_url:
        type: string
      duration_seconds:
        minimum: 0
        type: integer
      explicit:
        type: boolean
      genre_ids:
        items:
          type: string
        type: array
      is_public:
        type: boolean
      title:
        maxLength: 250
        minLength: 1
        type: string
      track_number:
        minimum: 1
        type: integer
    required:
    - artist_id
    - duration_seconds
    - title
    type: object
  track.Genre:
    properties:
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  track.Track:
    properties:
      albumId:
        type: string
      artistId:
        type: string
      audioUrl:
        type: string
      coverUrl:
        type: string
      createdAt:
        type: string
      durationSeconds:
        type: integer
      explicit:
        type: boolean
      genres:
        items:
          $ref: '#/definitions/track.Genre'
        type: array
      id:
        type: string
      isPublic:
        type: boolean
      playCount:
        type: integer
      slug:
        type: string
      title:
        type: string
      trackNumber:
        type: integer
      updatedAt:
        type: string
    type: object
  track.UpdateRequest:
    properties:
      album_id:
        type: string
      audio_url:
        type: string
      cover_url:
        type: string
      duration_seconds:
        minimum: 0
        type: integer
      explicit:
        type: boolean
      genre_ids:
        items:
          type: string
        type: array
      is_public:
        type: boolean
      title:
        maxLength: 250
        minLength: 1
        type: string
      track_number:
        minimum: 1
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: This is the API server for the Music Streaming Application.
  title: Music Application API
  version: "1.0"
paths:
  /admin/media/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a single media file for artist images, album covers, track
        covers, or track audio.
      parameters:
      - description: Artist image file
        in: formData
        name: artistImage
        type: file
      - description: Album cover file
        in: formData
        name: albumCover
        type: file
      - description: Track cover file
        in: formData
        name: trackCover
        type: file
      - description: Track audio file
        in: formData
        name: trackAudio
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.ErrorResponse'
      security:
      - Bearer: []
      summary: Upload media file
      tags:
      - media
  /admin/tracks:
    get:
      description: Returns a paginated list of tracks including non-public entries
        for administrative access.
      parameters:
      - description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/track.Track'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: List all tracks
      tags:
      - tracks
  /albums:
    get:
      description: Returns a paginated list of albums.
      parameters:
      - description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/album.Album'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List albums
      tags:
      - albums
    post:
      consumes:
      - application/json
      description: Creates a new album.
      parameters:
      - description: Album creation payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/album.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/album.Album'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create album
      tags:
      - albums
  /albums/{albumID}:
    delete:
      description: Deletes an album by ID.
      parameters:
      - description: Album ID
        in: path
        name: albumID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete album
      tags:
      - albums
    get:
      description: Returns a single album by its ID.
      parameters:
      - description: Album ID
        in: path
        name: albumID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/album.Album'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get album by ID
      tags:
      - albums
    put:
      consumes:
      - application/json
      description: Updates an existing album by ID.
      parameters:
      - description: Album ID
        in: path
        name: albumID
        required: true
        type: string
      - description: Album update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/album.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/album.Album'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Update album
      tags:
      - albums
  /analytics/events:
    post:
      consumes:
      - application/json
      description: Records an analytics event for an authenticated or anonymous user.
      parameters:
      - description: Analytics event payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/analytics.TrackEventRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/analytics.TrackEventResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Track analytics event
      tags:
      - analytics
  /api/v1/admin/lyrics:
    post:
      consumes:
      - application/json
      description: Creates new lyrics for a track.
      parameters:
      - description: Create lyrics request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lyrics.CreateLyricsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Create lyrics
      tags:
      - lyrics
  /api/v1/admin/lyrics/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes existing lyrics.
      parameters:
      - description: Lyrics ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Delete lyrics
      tags:
      - lyrics
    put:
      consumes:
      - application/json
      description: Updates existing lyrics.
      parameters:
      - description: Lyrics ID
        in: path
        name: id
        required: true
        type: string
      - description: Update lyrics request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/lyrics.UpdateLyricsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - Bearer: []
      summary: Update lyrics
      tags:
      - lyrics
  /api/v1/tracks/{trackId}/lyrics:
    get:
      consumes:
      - application/json
      description: Returns lyrics for a specific track.
      parameters:
      - description: Track ID
        in: path
        name: trackId
        required: true
        type: string
      - description: Language code (e.g., en, es)
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get track lyrics
      tags:
      - lyrics
  /api/v1/tracks/{trackId}/lyrics/all:
    get:
      consumes:
      - application/json
      description: Returns all lyrics for a specific track.
      parameters:
      - description: Track ID
        in: path
        name: trackId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get lyrics by track ID
      tags:
      - lyrics
  /artists:
    get:
      description: Returns a paginated list of artists.
      parameters:
      - description: Maximum number of items to return
        in: query
        name: limit
        type: integer
      - description: Number of items to skip
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/artist.Artist'
