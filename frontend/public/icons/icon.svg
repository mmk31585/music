<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#050505"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Soundwave M -->
  <g transform="translate(80,80)">
    <!-- Left stem of M -->
    <rect x="0" y="60" width="40" height="200" rx="12" fill="#1DB954"/>
    <!-- Left soundwave bar -->
    <rect x="60" y="100" width="24" height="160" rx="8" fill="#1DB954" opacity="0.6"/>
    <!-- Center bar (tallest) -->
    <rect x="104" y="40" width="24" height="220" rx="8" fill="#1DB954"/>
    <!-- Right soundwave bar -->
    <rect x="148" y="80" width="24" height="180" rx="8" fill="#1DB954" opacity="0.6"/>
    <!-- Right stem of M -->
    <rect x="192" y="40" width="40" height="220" rx="12" fill="#B646FF"/>
  </g>
</svg>
