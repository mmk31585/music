<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="./music.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muse — Persian music streaming platform. Discover and stream Persian music, create playlists, and connect with artists.">
    <meta name="keywords" content="Persian music, Iranian music, music streaming, Persian songs, Farsi music">
    <meta name="robots" content="index, follow">
    <title>Muse — Persian Music Platform</title>

    <!-- Google Fonts: preconnect + stylesheet (avoids CSS @import blocking) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Lexend:wght@300;400;600;700;800;900&family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">

    <!-- JSON-LD structured data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MusicPlatform",
      "name": "Muse",
      "description": "Persian music streaming platform. Discover and stream Persian music, create playlists, and connect with artists.",
      "url": "https://muse.app",
      "inLanguage": ["fa", "en"],
      "applicationCategory": "Music",
      "operatingSystem": "All",
      "offers": {
        "@type": "Offer",
        "availability": "https://schema.org/InStock"
      }
    }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
