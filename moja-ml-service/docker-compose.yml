services:
  # ── FastAPI application ──────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ml}:${POSTGRES_PASSWORD:-ml}@postgres:5432/${POSTGRES_DB:-ml}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Celery worker (lyrics + cover + embedding tasks) ─────────────────
  # Conservative single-worker default for a tight-RAM VPS. Listens to all
  # queues sequentially at concurrency=1 to avoid OOM from loading multiple
  # ML models in parallel. If either queue backs up significantly under
  # real load, split into separate worker containers (one per queue, each
  # still concurrency=1) — provided enough RAM is available for both
  # openl3 (~1 GB) and faster-whisper (~2 GB) simultaneously.
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uv run celery
      -A app.workers.celery_app worker
      --loglevel=info
      --queues=lyrics_queue,covers_queue,embedding_queue
      --concurrency=1
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ml}:${POSTGRES_PASSWORD:-ml}@postgres:5432/${POSTGRES_DB:-ml}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Tune this to your actual VPS RAM. 4G is a safe starting point
          # for a Whisper "medium" model (int8) + openl3 (TF) + Python overhead.
          memory: 4G

  # ── Redis (broker + result backend for Celery, general-purpose cache) ──
  redis:
    image: redis:8-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Postgres (this service's own database) ───────────────────────────
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ml}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ml}
      POSTGRES_DB: ${POSTGRES_DB:-ml}
    ports:
      # Expose on 5433 to avoid conflict with the Go backend's Postgres on 5432
      - "5433:5432"
    volumes:
      - ml_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ml}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  ml_pgdata:
